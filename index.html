<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Utopia System | Wnt. Snwf.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05070a;
            color: #b0e6ff;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        /* 扫描线效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }
        /* 终端容器 */
        #terminal {
            width: 100%;
            height: 100vh;
            padding: 30px 40px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2a3f4f #05070a;
        }
        #terminal::-webkit-scrollbar {
            width: 8px;
        }
        #terminal::-webkit-scrollbar-track {
            background: #05070a;
        }
        #terminal::-webkit-scrollbar-thumb {
            background-color: #2a3f4f;
            border-radius: 4px;
        }
        /* 输出行 */
        .output-line {
            margin-bottom: 6px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        /* 文字样式 */
        .system-gray { color: #6c7a89; }
        .system-cyan { color: #00e5ff; }
        .user-input { color: #ffffff; }
        .error { color: #ff5277; }
        .success { color: #4ade80; }
        .highlight {
            color: #f0f9ff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }
        a {
            color: #00e5ff;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }
        /* 输入行 */
        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .prompt {
            color: #00e5ff;
            font-weight: bold;
        }
        #input-text {
            flex: 1;
            outline: none;
            caret-color: transparent;
        }
        /* 光标闪烁 */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #b0e6ff;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        /* 隐藏输入框 */
        #hidden-input {
            position: absolute;
            opacity: 0;
            left: -9999px;
            top: 0;
        }
        /* 故障文字效果 */
        .glitch {
            position: relative;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch::before {
            color: #ff00c8;
            animation: glitch-1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        .glitch::after {
            color: #00fff7;
            animation: glitch-2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        @keyframes glitch-1 {
            0% { transform: translateX(0); }
            20% { transform: translateX(-2px); }
            40% { transform: translateX(2px); }
            60% { transform: translateX(-1px); }
            80% { transform: translateX(1px); }
            100% { transform: translateX(0); }
        }
        @keyframes glitch-2 {
            0% { transform: translateX(0); }
            20% { transform: translateX(2px); }
            40% { transform: translateX(-2px); }
            60% { transform: translateX(1px); }
            80% { transform: translateX(-1px); }
            100% { transform: translateX(0); }
        }
        /* 响应式适配 */
        @media (max-width: 600px) {
            #terminal {
                padding: 20px 15px;
                font-size: 14px;
            }
            .cursor {
                height: 16px;
                width: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div class="input-line">
            <span class="prompt">&gt;&gt;&gt;</span>
            <span id="input-text"></span>
            <span class="cursor"></span>
        </div>
    </div>
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <script>
        const output = document.getElementById('output');
        const inputText = document.getElementById('input-text');
        const hiddenInput = document.getElementById('hidden-input');
        const terminal = document.getElementById('terminal');

        let commandHistory = [];
        let historyIndex = -1;
        let currentInput = '';

        // 页面初始化
        window.onload = () => {
            hiddenInput.focus();
            bootSystem();
        };

        // 点击终端聚焦输入
        terminal.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // 同步输入内容
        hiddenInput.addEventListener('input', () => {
            currentInput = hiddenInput.value;
            inputText.textContent = currentInput;
        });

        // 键盘事件处理
        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const command = currentInput.trim();
                if (command) {
                    commandHistory.push(command);
                    historyIndex = commandHistory.length;
                    printUserInput(command);
                    executeCommand(command);
                }
                currentInput = '';
                hiddenInput.value = '';
                inputText.textContent = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    currentInput = commandHistory[historyIndex];
                    hiddenInput.value = currentInput;
                    inputText.textContent = currentInput;
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    currentInput = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    currentInput = '';
                }
                hiddenInput.value = currentInput;
                inputText.textContent = currentInput;
            }
        });

        // 系统启动动画
        function bootSystem() {
            const bootLines = [
                { text: '=== Anti-Utopia System v1.0 ===', class: 'highlight glitch', delay: 0 },
                { text: 'Initializing core modules...', class: 'system-gray', delay: 500 },
                { text: '[OK] Memory module loaded', class: 'success', delay: 300 },
                { text: '[OK] User profile linked: Wnt. Snwf.', class: 'success', delay: 300 },
                { text: '[WARN] Utopia module not found', class: 'error', delay: 400 },
                { text: 'System ready.', class: 'system-cyan', delay: 500 },
                { text: 'Type "help" to list all available commands.', class: 'system-gray', delay: 200 }
            ];

            let totalDelay = 0;
            bootLines.forEach(line => {
                totalDelay += line.delay;
                setTimeout(() => {
                    appendOutput(line.text, line.class);
                    // 给故障元素添加data-text
                    if (line.class.includes('glitch')) {
                        const lastLine = output.lastElementChild;
                        lastLine.setAttribute('data-text', line.text);
                    }
                    scrollToBottom();
                }, totalDelay);
            });
        }

        // 打印用户输入
        function printUserInput(text) {
            const line = document.createElement('div');
            line.className = 'output-line';
            line.innerHTML = `<span class="prompt">&gt;&gt;&gt;</span> <span class="user-input">${escapeHtml(text)}</span>`;
            output.appendChild(line);
            scrollToBottom();
        }

        // 追加文本输出
        function appendOutput(text, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.textContent = text;
            output.appendChild(line);
            scrollToBottom();
        }

        // 追加HTML输出
        function appendHtml(html, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.innerHTML = html;
            output.appendChild(line);
            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 命令执行
        function executeCommand(cmd) {
            const command = cmd.toLowerCase();
            
            switch(command) {
                case 'help':
                    showHelp();
                    break;
                case 'bio':
                    showBio();
                    break;
                case 'status':
                    showStatus();
                    break;
                case 'groups':
                    showGroups();
                    break;
                case 'contact':
                    showContact();
                    break;
                case 'social':
                    showSocial();
                    break;
                case 'utopia':
                    showUtopia();
                    break;
                case 'clear':
                    clearTerminal();
                    break;
                case 'bilibili':
                    showBilibili();
                    break;
                case 'steam':
                    showSteam();
                    break;
                case 'cafe':
                    showCafe();
                    break;
                case 'egg1':
                case 'kind':
                    showEgg1();
                    break;
                case 'egg2':
                case 'snow':
                    showEgg2();
                    break;
                case 'egg3':
                case 'understand':
                    showEgg3();
                    break;
                case 'egg4':
                case 'hope':
                    showEgg4();
                    break;
                case 'the world is an anti-utopia.':
                    showAdminWelcome();
                    break;
                default:
                    appendOutput(`Command not found: ${cmd}`, 'error');
                    appendOutput('Type "help" for available commands.', 'system-gray');
            }
        }

        // 帮助命令
        function showHelp() {
            const helpContent = `Available Commands:
  help        Show this help message
  bio         Display user biography
  status      Show online status & profile info
  groups      List owned and joined groups
  contact     Get contact email
  bilibili    Open Bilibili profile
  steam       Open Steam profile
  social      Show extended social media details
  cafe        Open Goodnight Café world
  utopia      Access Utopia module
  clear       Clear the terminal screen

[Hint] There are hidden commands waiting to be discovered.`;
            appendOutput(helpContent, 'system-cyan');
        }

        // 个人简介
        function showBio() {
            appendOutput('Loading user profile...', 'system-gray');
            setTimeout(() => {
                appendOutput('Success.', 'success');
                setTimeout(() => {
                    appendHtml(`<span class="prompt">&gt;&gt;&gt;</span> Load ISFP, INFP
<span class="success">Success.</span>

<span class="prompt">&gt;&gt;&gt;</span> Print bio
I've waited for spring, I've waited for understanding, I've waited for someone to say "of course".
But spring is always followed by winter, and understanding is always followed by misunderstanding.
Then I found out: the world is an anti-Utopia.`);
                }, 300);
            }, 400);
        }

        // 状态信息
        function showStatus() {
            const status = `Username:   Wnt. Snwf.
Status:     Online | 救赎...
Pronoun:    Yuki / 小雪`;
            appendOutput(status, 'highlight');
        }

        // 群组信息
        function showGroups() {
            const groups = `Owned Group:
  - WntSnwf

Joined Groups:
  - ネメシス教団
  - Lv.100 メンヘラ
  - ...`;
            appendOutput(groups);
        }

        // 联系方式
        function showContact() {
            const contact = `Email:  Fuyu_Yume@outlook.com`;
            appendOutput(contact);
        }

        // Bilibili主页
        function showBilibili() {
            appendHtml('Bilibili Profile: <a href="https://space.bilibili.com/337793420" target="_blank">https://space.bilibili.com/337793420</a>');
        }

        // Steam主页
        function showSteam() {
            appendHtml('Steam Profile: <a href="https://steamcommunity.com/id/WntSnwf" target="_blank">https://steamcommunity.com/id/WntSnwf</a>');
        }

        // 社交媒体详情
        function showSocial() {
            const social = `QQ:         2078029993 (Inactive account. Active account granted upon trust.)
WeChat:     Secret
Youtube:    Null
Twitter:    Null
Github:     WntSnwf`;
            appendOutput(social, 'system-gray');
        }

        // Utopia模块
        function showUtopia() {
            appendOutput('Accessing Utopia module...', 'system-gray');
            setTimeout(() => {
                const err1 = document.createElement('div');
                err1.className = 'output-line error glitch';
                err1.textContent = 'ERROR.CANNOTFIND.UTOPIA';
                err1.setAttribute('data-text', 'ERROR.CANNOTFIND.UTOPIA');
                output.appendChild(err1);
                scrollToBottom();

                setTimeout(() => {
                    const err2 = document.createElement('div');
                    err2.className = 'output-line error glitch';
                    err2.textContent = 'ERROR.CANNOTFIND.LIFE';
                    err2.setAttribute('data-text', 'ERROR.CANNOTFIND.LIFE');
                    output.appendChild(err2);
                    scrollToBottom();

                    setTimeout(() => {
                        appendOutput('Switching to Anti-Utopia System...', 'system-gray');
                        setTimeout(() => {
                            appendOutput('Anti-Utopia System is already running.', 'success');
                        }, 500);
                    }, 600);
                }, 400);
            }, 500);
        }

        // 清屏
        function clearTerminal() {
            output.innerHTML = '';
        }

        // 管理员欢迎效果
        function showAdminWelcome() {
            appendOutput('Verifying administrator identity...', 'system-gray');
            setTimeout(() => {
                appendOutput('[OK] Identity verification passed', 'success');
                setTimeout(() => {
                    appendOutput('Unlocking core system privileges...', 'system-gray');
                    setTimeout(() => {
                        appendHtml(`
<span class="highlight">Welcome, administrator.</span>
<span class="system-cyan">Admin ID: Nemesis & Yuki</span>
<span class="system-gray">Anti-Utopia System root access granted.</span>`);
                    }, 500);
                }, 500);
            }, 600);
        }

        // 彩蛋1
        function showEgg1() {
            const egg = `Congratulations on finding the hidden egg.

Everyone goes through difficult times.
When things feel heavy, try to gently let go of what's weighing you down.
Do something you truly enjoy -- listen to music, hear the sound of rain, anything that brings you peace.
Everything will be fine.

Be kind to yourself. Bright days are ahead.

Love from China.`;
            appendOutput(egg, 'highlight');
        }

        // 彩蛋2
        function showEgg2() {
            const egg = `Don't feel sad over my death.
Just as winter's crystal is fragile,
there's a time for every snowflake to melt.
If you can remember there has been a snowflake in your life,
that is enough.

不必为我的逝去哀戚。
若说冬日晶莹易碎，
须知每片雪花终将消融。
只要记得生命中曾有片雪花停留过，
便已足够。`;
            appendOutput(egg);
        }

        // 彩蛋3
        function showEgg3() {
            const egg = `You know, no one in the world can completely understand you.
Not your friends, not your parents, not even yourself.

But there must be someone willing to try to understand and accept you.
If you don't have that person yet, let me be that person.
Let me understand you, accept you, save you --

because that is exactly what no one has ever done for me.`;
            appendOutput(egg);
        }

        // 彩蛋4
        function showEgg4() {
            const egg = `Life is full of luck.
How far you rise, depends on how kindly it treats you.
It's ridiculous, but true.

So, since everything is already written into destiny,
what's the meaning of living in a ridiculous world,
doing ridiculous things that you may not wanna do,
and ridiculously preventing people from dying?

Maybe it's just because of that tiny, almost invisible hope.

---
Reply to Kamitora's VRChat bio,
and figure out why I want to prevent those whom I met and got along with from dying.`;
            appendOutput(egg);
        }

        // 咖啡屋链接
        function showCafe() {
            appendHtml('Goodnight Café: <a href="https://wntsnwf.github.io/GoodnightCafe.github.io/" target="_blank">https://wntsnwf.github.io/GoodnightCafe.github.io/</a>');
        }
    </script>
</body>
</html>
